services:
  grafana:
    platform: 'linux/amd64'
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-latest}
    healthcheck:
      test: curl -f http://localhost:3000 || exit 1
      start_period: 30s
      start_interval: 500ms
    ports:
      - 3000:3000/tcp
    networks:
      - opensearch-net
    # Without this, Grafana and the loader both start as soon as OpenSearch is healthy and
    # Playwright can reach an empty cluster.
    depends_on:
      opensearch-node1:
        condition: service_healthy
      opensearch-loader:
        condition: service_completed_successfully
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
  opensearch-node1:
    image: opensearchproject/opensearch:latest@sha256:508d340a2fdf8b9707d4f03435fd41b15f617d8b1495120665186f9912853e32
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true # along with the memlock settings below, disables swapping
      - bootstrap.system_call_filter=false # Disable for macOS compatibility
      - 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m' # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
      - 'OPENSEARCH_INITIAL_ADMIN_PASSWORD=my_%New%_passW0rd!@#'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600 # required for Performance Analyzer
    expose:
      - '9200'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sk -u "admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
          'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '"status":"\(green\|yellow\)"'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - opensearch-net
  # Seeds the deterministic end-to-end dataset, then exits. See tests/e2e/fixtures/README.md.
  opensearch-loader:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on:
      opensearch-node1:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: https://opensearch-node1:9200
      OPENSEARCH_PASSWORD: 'my_%New%_passW0rd!@#'
    volumes:
      - ./tests/e2e/fixtures:/fixtures:ro
    entrypoint:
      - sh
      - -c
      # Without `set -e` a failed curl leaves the loop running, the script exits 0, and
      # Grafana starts against an empty cluster.
      - |
        set -e
        for mapping in /fixtures/*.mapping.json; do
          index=$$(basename "$$mapping" .mapping.json)
          # Drop any previous copy first: creating an existing index is a 400, and the
          # documents would otherwise be indexed a second time, breaking the count
          # assertions. This keeps `npm run server` repeatable without `down -v`.
          curl -sk --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
            -u "admin:$$OPENSEARCH_PASSWORD" -X DELETE "$$OPENSEARCH_URL/$$index" > /dev/null
          curl -sfk --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
            -u "admin:$$OPENSEARCH_PASSWORD" -X PUT "$$OPENSEARCH_URL/$$index" \
            -H 'Content-Type: application/json' --data-binary "@$$mapping" > /dev/null
          # _bulk answers 200 even when every document fails, so the response body is the
          # only reliable signal.
          response=$$(curl -sfk --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
            -u "admin:$$OPENSEARCH_PASSWORD" -X POST "$$OPENSEARCH_URL/$$index/_bulk?refresh=wait_for" \
            -H 'Content-Type: application/x-ndjson' --data-binary "@/fixtures/$$index.ndjson")
          if echo "$$response" | grep -q '"errors":true'; then
            echo "Bulk indexing errors for $$index" >&2
            echo "$$response" >&2
            exit 1
          fi
          echo "Loaded $$index"
        done
    restart: 'no'
    networks:
      - opensearch-net
  opensearch-node2:
    image: opensearchproject/opensearch:latest@sha256:508d340a2fdf8b9707d4f03435fd41b15f617d8b1495120665186f9912853e32
    container_name: opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - bootstrap.system_call_filter=false # Disable for macOS compatibility
      - 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m'
      - 'OPENSEARCH_INITIAL_ADMIN_PASSWORD=my_%New%_passW0rd!@#'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      - opensearch-net
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest@sha256:1f4940affc0484d48e51c5d21ad0ecf50f4b33a49e1ad6b493b07f734275d264
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - '5601'
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node1:9200","https://opensearch-node2:9200"]'
    networks:
      - opensearch-net

volumes:
  opensearch-data1:
  opensearch-data2:

networks:
  opensearch-net:
